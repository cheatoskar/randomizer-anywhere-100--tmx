Game = "TMNF"
TmxGame = "TMNF"
BindIP = ""
XmlRpcPort = 5000
AutoSkipMode = "AuthorMedal"
TimeLimit = 3600000

Preset = "100tmx_tmnf"

ServerName = "100% TMX Project"
ServerComment = "100% TMX RMC - random maps, first to finish wins. Type /info or /source in chat."
GameSettings = "MatchSettings/Randomizer.txt"

# Start the RMC session automatically on server boot, no player needs to type /start
AutoStart = true

# Comma-separated TMF logins allowed to use /stop, /end, /start and /preset (direct, no vote needed).
# /presets (listing) and /votepreset (player vote) are open to everyone regardless of this setting.
AdminLogins = ""

# Port for the built-in HTTP server that hands players a download link to their own
# server-validated replay (the only kind TMX accepts). Open this TCP port in your firewall.
ReplayServerPort = 8090

# Hostname/IP players can reach this machine on, used to build the replay download link.
# Leave empty for local testing (falls back to localhost) - MUST be set to your public
# IP/domain once this runs on Hetzner, otherwise players get an unreachable link.
PublicHost = ""

# LAN-only mode (local network discovery, no masterserver registration). true for local
# testing, MUST be false for a real internet-facing Hetzner deployment.
Lan = false

# Discord webhook URL(s) for /imp and /hard reports. DiscordWebhookUrlHard is optional -
# leave it empty to send both /imp and /hard to the same DiscordWebhookUrl channel.
DiscordWebhookUrl = ""
DiscordWebhookUrlHard = ""

WelcomeMessage = '''
$FF0Welcome to $s$0BFRandomizer $FF8Anywhere$FF0!
Type $FF0/info$FF0 to see what this server can do.
'''

[DownloadUrls]
TMF = "http://files2.trackmaniaforever.com/TrackmaniaServer_2011-02-21.zip"
TM = "http://slig.free.fr/TM/dedicated/TmDedicatedServer_2006-05-30.zip"

[TmxQuery]
primarytype = 0
inunlimiter = 0